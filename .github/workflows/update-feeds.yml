name: Update ASN Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */8 * * *"  # every 8 hours, offset a bit to avoid API rush hours

permissions:
  contents: write

concurrency:
  group: asn-feeds
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      # === Configure your targets here ===
      ASNS: AS19318
      MIN_PEERS: "10"
      # Optional rolling window. Examples:
      # START_DAYS: "14"
      # END_DAYS: "0"
      OUTPUT_DIR: feeds
      EXCLUSIONS_FILE: feeds/exclusions.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build feeds
        env:
          ASNS: ${{ env.ASNS }}
          MIN_PEERS: ${{ env.MIN_PEERS }}
          START_DAYS: ${{ env.START_DAYS }}
          END_DAYS: ${{ env.END_DAYS }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          EXCLUSIONS_FILE: ${{ env.EXCLUSIONS_FILE }}
        run: |
          python scripts/build_multi_asn_feeds.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain ${OUTPUT_DIR})" ]]; then
            git add ${OUTPUT_DIR}
            git commit -m "chore(feeds): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit."
          fi
